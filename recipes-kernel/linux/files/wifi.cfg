# USB WiFi: RTL8188EUS (0bda:8179) via the in-tree rtl8xxxu mac80211 driver.
# Modules, not built-in: the driver loads rtlwifi/rtl8188eufw.bin at probe,
# and built-in USB probe runs before the rootfs (and /lib/firmware) is mounted.
CONFIG_CFG80211=m
CONFIG_MAC80211=m
CONFIG_RTL8XXXU=m
CONFIG_LEDS_CLASS=y

# WPA2/WPA3 ciphers used by mac80211
CONFIG_CRYPTO_CCM=y
CONFIG_CRYPTO_GCM=y
CONFIG_CRYPTO_CMAC=y
CONFIG_CRYPTO_AES=y
