# DRM Core
CONFIG_DRM=y
CONFIG_DRM_XLNX=y
CONFIG_DRM_XLNX_BRIDGE=y
CONFIG_DRM_XLNX_BRIDGE_VTC=y
CONFIG_DRM_XLNX_HDCP=y
CONFIG_XILINX_HDCP_COMMON=y
CONFIG_DRM_BRIDGE=y
CONFIG_DRM_PANEL_BRIDGE=y
CONFIG_DRM_PANEL=y
CONFIG_DRM_KMS_HELPER=y
CONFIG_DRM_GEM_DMA_HELPER=y
CONFIG_DRM_GEM_SHMEM_HELPER=y
CONFIG_DRM_DISPLAY_HELPER=y
CONFIG_DRM_DISPLAY_DP_HELPER=y
CONFIG_DRM_DISPLAY_HDMI_HELPER=y
CONFIG_DRM_SIMPLEDRM=y
CONFIG_DRM_CLIENT=y
CONFIG_DRM_CLIENT_LIB=y
CONFIG_DRM_CLIENT_SETUP=y
CONFIG_DRM_CLIENT_SELECTION=y
CONFIG_DRM_CLIENT_DEFAULT="fbdev"
CONFIG_DRM_CLIENT_DEFAULT_FBDEV=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_DRM_FBDEV_OVERALLOC=100
CONFIG_APERTURE_HELPERS=y
CONFIG_DRM_PANEL_ORIENTATION_QUIRKS=y
CONFIG_VT_HW_CONSOLE_BINDING=y

# HDMI and Video
CONFIG_HDMI=y
CONFIG_VIDEO=y
CONFIG_VIDEO_DEV=y

# Xilinx Video
CONFIG_VIDEO_XILINX=y
CONFIG_VIDEO_XILINX_VTC=y

# V4L2 and Video Device Support
CONFIG_VIDEOBUF2_CORE=y
CONFIG_VIDEOBUF2_DMA_CONTIG=y
CONFIG_VIDEOBUF2_MEMOPS=y
CONFIG_VIDEOBUF2_V4L2=y
CONFIG_VIDEO_V4L2_I2C=y
CONFIG_VIDEO_V4L2_SUBDEV_API=y

# Framebuffer
CONFIG_FB=y
CONFIG_FB_CORE=y
CONFIG_FB_NOTIFY=y
CONFIG_FIRMWARE_EDID=y
CONFIG_FB_DEVICE=y
CONFIG_FB_DEFERRED_IO=y
CONFIG_FB_DMAMEM_HELPERS=y
CONFIG_FB_DMAMEM_HELPERS_DEFERRED=y
CONFIG_FB_SYS_COPYAREA=y
CONFIG_FB_SYS_FILLRECT=y
CONFIG_FB_SYS_IMAGEBLIT=y
CONFIG_FB_SYS_FOPS=y
CONFIG_FB_SYSMEM_HELPERS=y
CONFIG_FB_SYSMEM_HELPERS_DEFERRED=y
CONFIG_VIDEOMODE_HELPERS=y

# Framebuffer Console
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY=y

# VGA Arbitration
CONFIG_VGA_ARB=y
CONFIG_VGA_ARB_MAX_GPUS=16

# Console Configuration
CONFIG_CONSOLE_LOGLEVEL_DEFAULT=7
CONFIG_CONSOLE_LOGLEVEL_QUIET=4
CONFIG_CONSOLE_TRANSLATIONS=y

# I2C for EDID and device control
CONFIG_I2C=y
CONFIG_I2C_CADENCE=y
CONFIG_I2C_XILINX=y
CONFIG_I2C_CHARDEV=y

# DMA for the Video Frame Buffer Read (v_frmbuf_rd) display path
CONFIG_DMADEVICES=y
CONFIG_XILINX_FRMBUF=y

# Clock and HDMI drivers (custom Digilent modules)
CONFIG_COMMON_CLK_DGLNT_DYNCLK=y
CONFIG_DRM_DIGILENT_HDMI=y

# FPGA Manager for bitstream loading
CONFIG_FPGA=y
CONFIG_FPGA_MGR_ZYNQ_FPGA=y
CONFIG_FIRMWARE_IN_KERNEL=y
CONFIG_DRM_XLNX_PL_DISP=y
