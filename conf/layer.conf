BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-jack"
BBFILE_PATTERN_meta-jack = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-jack = "10"

# Collection names (each layer's BBFILE_COLLECTIONS), not directory names:
#   core = oe-core, xilinx = meta-xilinx-core,
#   openembedded-layer = meta-oe (devmem2, ttf-dejavu),
#   qt6-layer = meta-qt6 (qtbase, qt6-cmake class for jack-panel)
LAYERDEPENDS_meta-jack = "core xilinx openembedded-layer qt6-layer"
LAYERSERIES_COMPAT_meta-jack = "wrynose"

PREFERRED_PROVIDER_virtual/kernel = "linux-xlnx"

MACHINE ?= "zynq-generic"
# design_1_wrapper_fb.xsa: Vivado 2025.2.1, Video Frame Buffer Read design
# (VDMA + subset-converter replaced by v_frmbuf_rd). HWH-verified: ap_clk on
# FCLK1, m_axi_mm ADDR_WIDTH=32, ap_rst_n<-axi_gpio_0, IRQ on xlconcat In0
# (SPI 61), BGRX8 format == XR24, rgb2dvi reset fix + TMDS externalized.
# Fall back to design_fixed_dvi_reset.xsa (proven PetaLinux VDMA design) if this regresses.
HDF_PATH ?= "/home/jack/Projects/fpga-network-project/design_1_wrapper_fb.xsa"


MACHINE_FEATURES += "fpga-overlay"

# Enable the generic (non-XSCT) embedded software build path.
# This activates: virtual/dtb -> device-tree, virtual/boot-bin -> xilinx-bootbin,
# and the fsbl-firmware_generic.inc compile rules (uses Yocto cross-compiler, no Vitis needed).
XILINX_WITH_ESW = "generic"

CONFIG_DTFILE = "${LAYERDIR}/recipes-bsp/device-tree/files/pynq-z2.dts"

DISTRO_FEATURES:append = " systemd usrmerge"
# wrynose's nodistro defaults add these; Zynq-7000 has no GPU and the Qt UI
# relies on qtbase configuring no-opengl + linuxfb (see Qt section below).
DISTRO_FEATURES:remove = "opengl vulkan wayland pulseaudio ptest gobject-introspection-data"
DISTRO_FEATURES_OPTED_OUT:append = " sysvinit"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = ""

WKS_FILE = "xilinx-default-sd.wks"
IMAGE_FSTYPES:append = " wic wic.bmap"
BBMULTICONFIG += "fsbl-fw"
IMAGE_BOOT_FILES:append = " system.dtb"

# Hard dependency: BOOT.bin (FSBL + U-Boot) and the DTB must be built before
# any image task runs. WKS_FILE_DEPENDS covers the wic assembly step; this
# covers do_rootfs and everything before it.
EXTRA_IMAGEDEPENDS:append = " xilinx-bootbin virtual/dtb bitstream"

# NOTE: the wks builds the boot partition from rootfs /boot (--source rootfs
# --change-directory=boot), so IMAGE_BOOT_FILES entries are never copied
# directly. They matter in two other ways (machine-xilinx-default.inc):
#   1. They pull matching packages into the rootfs /boot via
#      MACHINE_ESSENTIAL_EXTRA_RDEPENDS (uEnv.txt -> u-boot-xlnx-uenv).
#   2. u-boot-xlnx-uenv scans them (boot_files_bitstream) to generate the
#      loadfpga command in uEnv.txt, so the name below must match where the
#      bitstream package installs the file under /boot. No '/' allowed in the
#      name: u-boot-xlnx-scr substitutes it into a sed s/// expression.
IMAGE_BOOT_FILES:append = " zynq-generic.bin"
IMAGE_BOOT_FILES:append = " uEnv.txt"

# Include bitstream package in rootfs so /lib/firmware/ has the file for fpga-manager
IMAGE_INSTALL:append = " bitstream usbutils clk-dglnt-dynclk digilent-hdmi"
# modetest for exercising the DRM pipeline, devmem2 for PL register debugging
IMAGE_INSTALL:append = " libdrm-tests devmem2"

IMAGE_INSTALL:append = " htop"

# RTL8188EUS USB WiFi (rtl8xxxu + firmware + wpa_supplicant + networkd DHCP)
IMAGE_INSTALL:append = " jack-wifi"

# Qt 6 GUI stack (meta-qt6). Zynq-7000 has no GPU, so Qt renders in software.
# With nodistro (no opengl/x11 DISTRO_FEATURES) qtbase auto-configures
# no-opengl + linuxfb and sets linuxfb as the default platform plugin — apps
# draw straight to /dev/fb0 (the DRM fbdev of our display pipeline), input via
# libinput/evdev (USB mouse/kbd). fontconfig+widgets are qtbase defaults;
# ttf-dejavu supplies actual fonts. For QML later: add qtdeclarative and run
# with QT_QUICK_BACKEND=software.
IMAGE_INSTALL:append = " qtbase qtbase-plugins qtbase-tools ttf-dejavu-sans"
# Our Qt UI, autostarts on the display in place of the tty1 getty
IMAGE_INSTALL:append = " jack-panel"

# Machine-local settings (HDF_PATH, WIFI_SSID/WIFI_PSK): gitignored, optional.
# bitbake re-parses it when it changes, so edits apply on the next build.
include ${LAYERDIR}/conf/jack-local.conf
