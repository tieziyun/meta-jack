BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-jack"
BBFILE_PATTERN_meta-jack = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-jack = "10"

LAYERDEPENDS_meta-jack = "core xilinx"
LAYERSERIES_COMPAT_meta-jack = "scarthgap"

PREFERRED_PROVIDER_virtual/kernel = "linux-xlnx"

# Mask the PL filter module until source files exist under recipes-modules/xdp-pl-filter/files/
BBMASK += "meta-jack/recipes-modules/xdp-pl-filter"

MACHINE ?= "zynq-generic"
HDF_PATH ?= "/home/jack/Projects/fpga-network-project/design_1_wrapper.xsa"


MACHINE_FEATURES += "fpga-overlay"

# Enable the generic (non-XSCT) embedded software build path.
# This activates: virtual/dtb -> device-tree, virtual/boot-bin -> xilinx-bootbin,
# and the fsbl-firmware_generic.inc compile rules (uses Yocto cross-compiler, no Vitis needed).
XILINX_WITH_ESW = "generic"

CONFIG_DTFILE = "${LAYERDIR}/recipes-bsp/device-tree/files/pynq-z2.dts"

DISTRO_FEATURES:append = " systemd usrmerge"
DISTRO_FEATURES_BACKFILL_CONSIDERED:append = " sysvinit"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = ""

WKS_FILE = "xilinx-default-sd.wks"
IMAGE_FSTYPES:append = " wic wic.bmap"
BBMULTICONFIG += "fsbl-fw"
IMAGE_BOOT_FILES:append = " system.dtb"

# Hard dependency: BOOT.bin (FSBL + U-Boot) and the DTB must be built before
# any image task runs. WKS_FILE_DEPENDS covers the wic assembly step; this
# covers do_rootfs and everything before it.
EXTRA_IMAGEDEPENDS:append = " xilinx-bootbin virtual/dtb"
