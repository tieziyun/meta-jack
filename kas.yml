header:
  version: 14

machine: zynq-generic
distro: nodistro
target: core-image-minimal

# This file lives inside meta-jack so it is versioned with the project layer.
# Run kas from the project root (the directory containing sources/ and build/):
#   kas build sources/meta-jack/kas.yml
# The explicit path: entries keep all third-party repos under sources/.

repos:
  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    branch: wrynose
    commit: 0f03c732a0a2d0506b41b1abe60b3f368b2300dc
    path: sources/openembedded-core
    layers:
      meta:

  bitbake:
    url: https://git.openembedded.org/bitbake
    branch: "2.18"
    commit: 51fd94a67fa17650a9ff623492005972bbc7d26f
    path: sources/bitbake
    # bitbake is not a layer; without this kas adds the repo root to BBLAYERS
    layers:
      .: disabled

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: wrynose
    commit: f28a144aa0a0ae05ca2ee91e1aef6aa05f6a12db
    path: sources/meta-openembedded
    layers:
      meta-oe:
      meta-python:

  meta-arm:
    url: https://git.yoctoproject.org/meta-arm
    branch: wrynose
    commit: 673e8d7c5dcd14de58092eb73e6ecc5eee5c1735
    path: sources/meta-arm
    layers:
      meta-arm-toolchain:
      meta-arm:

  meta-xilinx:
    url: https://github.com/Xilinx/meta-xilinx
    branch: wrynose
    commit: 1231e93e0aa083d67ad60e9670733addcc501e92
    path: sources/meta-xilinx
    layers:
      meta-xilinx-core:
      meta-xilinx-standalone:

  meta-qt6:
    url: https://code.qt.io/yocto/meta-qt6.git
    branch: "6.11"
    commit: ec98b3ab1c8deeab9412ef6cbfd55729dc567b01
    path: sources/meta-qt6
    layers:
      .:

  meta-jack:
    path: sources/meta-jack
    layers:
      .:

local_conf_header:
  meta-jack: |
    # Machine-local settings (HDF_PATH, WiFi credentials) live in the
    # gitignored conf/jack-local.conf, included from conf/layer.conf.
    BB_NUMBER_THREADS = "${@os.cpu_count()}"
    PARALLEL_MAKE = "-j ${@os.cpu_count()}"
    # Dev board: root login on the UART console with an empty password.
    EXTRA_IMAGE_FEATURES += "allow-empty-password empty-root-password allow-root-login"
