header:
  version: 14

machine: zynq-generic
distro: nodistro
target: core-image-minimal

# This file lives inside meta-jack so it is versioned with the project layer.
# Run kas from the project root (the directory containing sources/ and build/):
#   kas build sources/meta-jack/kas.yml:kas-local.yml
# The explicit path: entries keep all third-party repos under sources/.

repos:
  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    branch: scarthgap
    commit: d4950d6df0867dcd5c380d83ac4d138ec968e698
    path: sources/openembedded-core
    layers:
      meta:

  bitbake:
    url: https://git.openembedded.org/bitbake
    branch: "2.8"
    commit: 0880963fea4d91a034e4a6e007d23f98658ab986
    path: sources/bitbake
    # bitbake is not a layer; without this kas adds the repo root to BBLAYERS
    layers:
      .: disabled

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: scarthgap
    commit: b0c2c648a1af89e7a8dd4c2ec841f3bc0ed0ccb9
    path: sources/meta-openembedded
    layers:
      meta-oe:
      meta-python:

  meta-arm:
    url: https://git.yoctoproject.org/meta-arm
    branch: scarthgap
    commit: 23b572c40ea6709ab3f8bd7abbb5a795fc3631c2
    path: sources/meta-arm
    layers:
      meta-arm-toolchain:
      meta-arm:

  meta-xilinx:
    url: https://github.com/Xilinx/meta-xilinx
    branch: rel-v2026.1
    commit: 63094feee6c1c310f62bd3a9957a64ed52f1fdc1
    path: sources/meta-xilinx
    layers:
      meta-xilinx-core:
      meta-xilinx-standalone:

  meta-xilinx-tools:
    url: https://github.com/Xilinx/meta-xilinx-tools
    branch: rel-v2026.1
    commit: 94fea5f042e34522e9caf70c134817a046ca7e08
    path: sources/meta-xilinx-tools

  meta-qt6:
    url: https://code.qt.io/yocto/meta-qt6.git
    branch: "6.8"
    commit: 2a9a0070f652134e15df332918a012862bf34047
    path: sources/meta-qt6
    layers:
      .:

  meta-jack:
    path: sources/meta-jack
    layers:
      .:

local_conf_header:
  meta-jack: |
    # Path to the Vivado-exported XSA for the PYNQ Z2 block design.
    # Override this in a kas include file (e.g. kas-local.yml) — do not commit
    # a machine-specific path here.
    # HDF_PATH = "/path/to/design.xsa"
    BB_NUMBER_THREADS = "${@os.cpu_count()}"
    PARALLEL_MAKE = "-j ${@os.cpu_count()}"
